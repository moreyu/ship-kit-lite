<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="已登记下班上架 Ship Kit 完整版候补。">
    <meta name="theme-color" content="#f8f9fa">
    <title>登记成功 · 下班上架 Ship Kit</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M20 20 L80 20 L80 80 L20 80 Z' fill='%230a84ff' fill-opacity='0.1' stroke='%230a84ff' stroke-width='8'/%3E%3Ctext x='50' y='55' font-family='system-ui' font-size='68' font-weight='700' fill='%230a84ff' text-anchor='middle'%3E%F0%9F%93%B1%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --accent: #0a84ff;
            --text: #1d1d1f;
            --text-secondary: #555;
            --bg: #f8f9fa;
            --card: #ffffff;
            --border: #e5e5e5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            font-size: 17px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
        .container { max-width: 560px; margin: 0 auto; padding: 0 20px; width: 100%; }

        header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 18px 0;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #1d1d1f;
        }
        .logo span { color: var(--accent); }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 48px 0 64px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            text-align: center;
        }
        .check {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(10,132,255,0.12);
            color: var(--accent);
            font-size: 1.75rem;
            line-height: 56px;
            margin: 0 auto 20px;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .pitch {
            color: var(--text-secondary);
            margin-bottom: 28px;
        }
        .cta-btn {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 12px 28px;
            border-radius: 9999px;
            font-weight: 600;
            margin: 6px 4px;
        }
        .cta-btn:hover { background: #0a6bff; text-decoration: none; }
        .cta-btn.secondary {
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
        }
        .cta-btn.secondary:hover { background: rgba(10,132,255,0.06); }

        footer {
            background: #111;
            color: #aaa;
            padding: 28px 0;
            font-size: 0.85rem;
            text-align: center;
        }
        footer a { color: #ccc; }

        @media (max-width: 480px) {
            .card { padding: 32px 20px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo"><span>下班上架</span> · Ship Kit</div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="card">
                <div class="check" aria-hidden="true">✓</div>
                <h1>已登记，谢谢</h1>
                <p class="pitch">完整版上线时，我们会发邮件通知你。<br>同时可以先用免费 Lite 做提审自检。</p>
                <div>
                    <a class="cta-btn" href="https://github.com/moreyu/ship-kit-lite/releases/download/v0.1/ship-kit-lite.zip">下载 Lite</a>
                    <a class="cta-btn secondary" href="https://github.com/moreyu/ship-kit-lite">查看仓库</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>下班上架 · Ship Kit · <a href="https://github.com/moreyu/ship-kit-lite">GitHub</a> · MIT</p>
        </div>
    </footer>
</body>
</html>
